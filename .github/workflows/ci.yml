name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php:
    name: Lint & test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish || true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist || true

      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "PHP lint passed"

      - name: Financial-logic tests
        run: php tests/run-tests.php

      - name: Guard against committed secrets/data
        run: |
          set -e
          # Allow the public database package only: schema, demo seed, migrations.
          if git ls-files | grep -E '(^|/)\.env$|config\.ini$|\.sql$' \
              | grep -vE 'database/(schema|demo_seed)\.sql$|database/migrations/.+\.sql$'; then
            echo "::error::A private/secret file appears to be tracked."
            exit 1
          fi
          echo "No tracked secrets or private SQL."
